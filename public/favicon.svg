<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     width="32" height="32"
     role="img"
     aria-label="Jesco favicon">

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14"
          fill="none"
          stroke="#1C1917"
          stroke-width="1.2"/>

  <!-- J: horizontal cap -->
  <line x1="16" y1="6" x2="22" y2="6"
        stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>

  <!-- J: vertical stroke -->
  <line x1="16" y1="6" x2="16" y2="20"
        stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>

  <!-- J: arc hook — terracotta -->
  <path d="M 16 20 A 6 6 0 0 1 10 26"
        fill="none"
        stroke="#B5541E"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Node: cap -->
  <circle cx="22" cy="6" r="2" fill="#1C1917"/>

  <!-- Node: hook -->
  <circle cx="10" cy="26" r="2" fill="#B5541E"/>

</svg>
