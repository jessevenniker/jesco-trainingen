<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 80 80"
     width="80" height="80"
     role="img"
     aria-label="Jesco Innovation icon">

  <!-- Outer precision ring -->
  <circle cx="40" cy="40" r="34"
          fill="none"
          stroke="#F4F0EB"
          stroke-width="2"/>

  <!-- J: horizontal cap -->
  <line x1="40" y1="13" x2="54" y2="13"
        stroke="#F4F0EB" stroke-width="3.8" stroke-linecap="round"/>

  <!-- J: vertical stroke -->
  <line x1="40" y1="13" x2="40" y2="50"
        stroke="#F4F0EB" stroke-width="3.8" stroke-linecap="round"/>

  <!-- J: arc hook — terracotta -->
  <path d="M 40 50 A 16 16 0 0 1 24 66"
        fill="none"
        stroke="#D4652A"
        stroke-width="3.8"
        stroke-linecap="round"/>

  <!-- Node: cap terminus -->
  <circle cx="54" cy="13" r="5.5" fill="#F4F0EB"/>

  <!-- Node: hook terminus -->
  <circle cx="24" cy="66" r="5.5" fill="#D4652A"/>

</svg>
